name: Build and Publish Executor to DockerHub

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Executor/**'
      - '.github/workflows/publish-executor.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: xianix-executor
  DOCKERHUB_USERNAME: hasithy99x
  DOCKERHUB_ORG: 99xio
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Lint the load-bearing bash before it ships in the image. Runs on PRs that
    # touch Executor/ and as a gate before any tag-triggered publish.
    - name: Run shellcheck on Executor scripts
      run: shellcheck --severity=warning Executor/*.sh Executor/tests/*.sh

  # End-to-end tests against the real image: build it, then run the executor
  # the same way the control plane does (env vars in, JSON envelope out) using
  # a locally generated fixture repository. See Executor/tests/integration_test.sh.
  #
  # The hermetic tier (clone / fetch / error-envelope tests) always runs. The
  # live Claude Code test additionally needs the ANTHROPIC_API_KEY secret and
  # is skipped automatically when it is absent (e.g. on fork PRs).
  integration-test:
    runs-on: ubuntu-latest
    needs: shellcheck
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Single-arch build for testing (fast); shares the GHA layer cache with the
    # multi-arch publish build below. Infra tools are left out — they are not
    # exercised by the tests and roughly double the build time.
    - name: Build executor image for testing
      uses: docker/build-push-action@v6
      with:
        context: ./Executor
        file: ./Executor/Dockerfile
        platforms: linux/amd64
        load: true
        push: false
        tags: xianix-executor:integration-test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run integration tests
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        SKIP_BUILD=1 IMAGE=xianix-executor:integration-test \
          ./Executor/tests/integration_test.sh

  build-and-push:
    runs-on: ubuntu-latest
    needs: [shellcheck, integration-test]
    # Only publish on tag pushes / manual dispatch — never on pull_request events
    # (which run shellcheck only and lack DockerHub push credentials).
    if: github.event_name != 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
        labels: |
          org.opencontainers.image.title=${{ env.IMAGE_NAME }}
          org.opencontainers.image.description=Xianix Executor — isolated container for tenant-scoped Claude Code execution
          org.opencontainers.image.vendor=${{ env.DOCKERHUB_ORG }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./Executor
        file: ./Executor/Dockerfile
        build-args: |
          INSTALL_INFRA_TOOLS=1
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate build summary
      run: |
        echo "## Xianix Executor Docker Image Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Pull:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

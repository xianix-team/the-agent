name: Build and Publish OpenCode Executor to DockerHub

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Executor.OpenCode/**'
      - '.github/workflows/publish-executor-opencode.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: executor.opencode
  DOCKERHUB_USERNAME: hasithy99x
  DOCKERHUB_ORG: 99xio
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Run shellcheck on Executor.OpenCode scripts
      run: shellcheck --severity=warning Executor.OpenCode/*.sh Executor.OpenCode/tests/*.sh

  integration-test:
    runs-on: ubuntu-latest
    needs: shellcheck
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Publish official plugins into Executor.OpenCode/vendor
      run: python Executor.OpenCode/scripts/publish_plugins.py

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build OpenCode executor image for testing
      uses: docker/build-push-action@v6
      with:
        context: ./Executor.OpenCode
        file: ./Executor.OpenCode/Dockerfile
        platforms: linux/amd64
        load: true
        push: false
        tags: executor.opencode:integration-test
        cache-from: type=gha,scope=executor-opencode
        cache-to: type=gha,mode=max,scope=executor-opencode

    - name: Run integration tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        SKIP_BUILD=1 IMAGE=executor.opencode:integration-test \
          ./Executor.OpenCode/tests/integration_test.sh

  build-and-push:
    runs-on: ubuntu-latest
    needs: [shellcheck, integration-test]
    if: github.event_name != 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Publish official plugins into Executor.OpenCode/vendor
      run: python Executor.OpenCode/scripts/publish_plugins.py

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
        labels: |
          org.opencontainers.image.title=${{ env.IMAGE_NAME }}
          org.opencontainers.image.description=Xianix OpenCode Executor — isolated container for tenant-scoped OpenCode execution
          org.opencontainers.image.vendor=${{ env.DOCKERHUB_ORG }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./Executor.OpenCode
        file: ./Executor.OpenCode/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=executor-opencode
        cache-to: type=gha,mode=max,scope=executor-opencode

    - name: Generate build summary
      run: |
        echo "## Xianix OpenCode Executor Docker Image Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Pull:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
